version: 3

dotenv: [".env"]

vars:
  LX_LUA_VERSION: "jit"
  LX_ARGS: "--lua-version {{ .LX_LUA_VERSION }}"
  SRC_PANO_LAYOUTS: '{{ joinPath .ROOT_DIR "content" "panorama" "layout" }}'
  SRC_PANO_SCRIPTS: '{{ joinPath .ROOT_DIR "src" "content" "panorama" "scripts" }}'
  SRC_PANO_STYLES: '{{ joinPath .ROOT_DIR "content" "panorama" "styles" }}'
  SRC_VSCRIPTS: '{{ joinPath .ROOT_DIR "game" "scripts" "vscripts" }}'
  SRC_TASKS: '{{ joinPath .ROOT_DIR "src" "tasks" }}'
  TASKS_ENTRYPOINT: '{{ joinPath .SRC_TASKS "main.ts" }}'
  TASKS_DEBUG_FLAGS: '{{ empty .DEBUG | ternary "" "--debug" }}'
  EMMYLUA_CONFIG: '{{ joinPath .ROOT_DIR ".emmyrc.json" }}'
  STYLUA_CONFIG: '{{ joinPath .ROOT_DIR ".stylua.toml" }}'
  SELENE_CONFIG: '{{ joinPath .ROOT_DIR "selene.toml" }}'

tasks:
  default:
    cmds:
      - task: format
      - task: lint
      - task: test
      - task: build

  format:
    desc: Run all formatters
    cmds:
      - task: format:tasks
      - task: format:vscripts
      - task: format:panorama

  lint:
    desc: Run all linters
    cmds:
      - task: lint:tasks
      - task: lint:vscripts
      - task: lint:panorama

  test:
    desc: Run all tests
    cmds:
      - task: test:vscripts

  clean:
    desc: Remove all compiled, generated and linked files
    cmd: bun run -- "{{ .TASKS_ENTRYPOINT }}" {{ .TASKS_DEBUG_FLAGS }} clean

  link:
    desc: Link source files to game directories
    cmd: bun run -- "{{ .TASKS_ENTRYPOINT }}" {{ .TASKS_DEBUG_FLAGS }} link

  launch:game:
    desc: Launch Dota2
    cmd: bun run -- "{{ .TASKS_ENTRYPOINT }}" {{ .TASKS_DEBUG_FLAGS }} launch game

  launch:sdk:
    desc: Launch SDK (Workshop Tools)
    cmd: bun run -- "{{ .TASKS_ENTRYPOINT }}" {{ .TASKS_DEBUG_FLAGS }} launch sdk

  build:
    desc: Build everything
    deps: [link]
    cmd: bun run -- "{{ .TASKS_ENTRYPOINT }}" {{ .TASKS_DEBUG_FLAGS }} build

  build:maps:
    desc: Build maps
    cmd: bun run -- "{{ .TASKS_ENTRYPOINT }}" {{ .TASKS_DEBUG_FLAGS }} build maps

  build:panorama:scripts:
    desc: Build panorama scripts
    cmd: bun run -- "{{ .TASKS_ENTRYPOINT }}" {{ .TASKS_DEBUG_FLAGS }} build panorama-scripts

  build:resources:
    deps: [build:panorama:scripts]
    desc: Build resources
    cmd: bun run -- "{{ .TASKS_ENTRYPOINT }}" {{ .TASKS_DEBUG_FLAGS }} build resources

  format:vscripts:
    desc: Format vscripts
    cmd: stylua --verify --config-path "{{ .STYLUA_CONFIG }}" "{{ .SRC_VSCRIPTS }}"

  lint:vscripts:
    desc: Lint vscripts
    cmds:
      - emmylua_check --config "{{ .EMMYLUA_CONFIG }}" "{{ .SRC_VSCRIPTS }}"
      - selene --config "{{ .SELENE_CONFIG }}" "{{ .SRC_VSCRIPTS }}"

  test:vscripts:
    desc: Test vscripts
    cmd: lx {{ .LX_ARGS }} test -- {{ .CLI_ARGS }}

  format:panorama:
    desc: Format all panorama files
    cmds:
      - task: format:panorama:layouts
      - task: format:panorama:scripts
      - task: format:panorama:styles

  lint:panorama:
    desc: Lint all panorama files
    cmds:
      - task: lint:panorama:layouts
      - task: lint:panorama:scripts
      - task: lint:panorama:styles

  format:panorama:layouts:
    desc: Format panorama layouts
    cmd: dprint fmt '{{ joinPath .SRC_PANO_LAYOUTS "**" }}'

  lint:panorama:layouts:
    desc: Lint panorama layouts
    cmd: echo "not implemented"

  format:panorama:scripts:
    desc: Format panorama scripts
    cmd: dprint fmt '{{ joinPath .SRC_PANO_SCRIPTS "**" }}'

  lint:panorama:scripts:
    desc: Lint panorama scripts
    dir: "{{ .SRC_PANO_SCRIPTS }}"
    cmd: bun x -- "@biomejs/biome" lint {{ .CLI_ARGS }}

  format:panorama:styles:
    desc: Format panorama styles
    cmd: dprint fmt '{{ joinPath .SRC_PANO_STYLES "**" }}'

  lint:panorama:styles:
    desc: Lint panorama styles
    dir: "{{ .SRC_PANO_STYLES }}"
    cmd: bun x -- "@biomejs/biome" lint {{ .CLI_ARGS }}

  format:tasks:
    desc: Format tasks
    cmd: dprint fmt '{{ joinPath .SRC_TASKS "**" }}'

  lint:tasks:
    desc: Lint tasks
    dir: "{{ .SRC_TASKS }}"
    cmd: bun x -- "@biomejs/biome" lint {{ .CLI_ARGS }}
